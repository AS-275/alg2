
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra 2 CBE Academy</title>
<style>
:root {
  --bg:#f7f8fc; --panel:#fff; --text:#192235; --muted:#667085;
  --line:#e5e8f0; --blue:#3659d9; --blue2:#edf1ff;
  --green:#16865b; --red:#c53b45; --orange:#b96a13;
  --shadow:0 5px 22px #1725540a;
}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.65}
button,input,textarea,select {font:inherit}
button {cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible {outline:3px solid #9eb2ff;outline-offset:2px}
header {height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}
.brand {font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.brand-icon {background:var(--blue);color:white;padding:4px 9px;border-radius:9px}
.header-right {display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.app {display:grid;grid-template-columns:255px minmax(0,1fr);min-height:calc(100vh - 66px)}
aside {background:var(--panel);border-right:1px solid var(--line);padding:22px 15px}
.nav-label {font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--muted);padding:10px 12px}
.nav-btn {width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:9px;color:#485269;display:flex;gap:10px;align-items:center;margin:3px 0;font-size:14px}
.nav-btn:hover,.nav-btn.active {background:var(--blue2);color:var(--blue);font-weight:700}
.nav-icon {width:22px;text-align:center}
.side-progress {margin:25px 8px 0;padding:15px;background:var(--bg);border-radius:12px;font-size:12px}
main {padding:32px;min-width:0;max-width:1350px;width:100%;margin:0 auto}
h1,h2,h3,h4 {line-height:1.3;margin-top:0}
h1 {font-size:clamp(27px,4vw,36px);letter-spacing:-.8px;margin-bottom:8px}
h2 {font-size:24px;letter-spacing:-.3px}
h3 {font-size:18px}
p {margin:9px 0 15px}
.muted {color:var(--muted)}
.small {font-size:12px}
.eyebrow {font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--blue);font-weight:800}
.page-head {margin-bottom:25px}
.page-head p {color:var(--muted);max-width:750px}
.grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.two-col {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card {background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:21px;box-shadow:var(--shadow);min-width:0}
.stat {font-size:30px;font-weight:800;letter-spacing:-1px;margin:5px 0}
.stat-label {font-size:13px;color:var(--muted)}
.btn {border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:10px 15px;font-weight:700;font-size:13px}
.btn:hover {border-color:#aab8f7}
.btn.primary {background:var(--blue);border-color:var(--blue);color:white}
.btn.primary:hover {background:#2848bf}
.btn.soft {background:var(--blue2);color:var(--blue);border-color:transparent}
.btn.danger {color:var(--red)}
.btn:disabled {opacity:.45;cursor:not-allowed}
.row {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.progress {height:8px;background:#e9ecf3;border-radius:30px;overflow:hidden}
.progress > div {height:100%;background:var(--blue);border-radius:30px;transition:width .25s}
.unit-card {display:flex;flex-direction:column;gap:12px}
.unit-top {display:flex;align-items:center;justify-content:space-between;gap:10px}
.unit-icon {width:42px;height:42px;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font-weight:800;border-radius:12px}
.pill {display:inline-block;background:#f0f2f7;border-radius:20px;padding:3px 9px;font-size:11px;color:#596176;font-weight:700}
.pill.green {background:#e4f7ed;color:var(--green)}
.pill.orange {background:#fff1dc;color:var(--orange)}
.lesson-list {display:grid;gap:9px}
.lesson-row {border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.lesson-row:hover {border-color:#a6b6ff;background:#fbfcff}
.lesson-check {height:27px;width:27px;border-radius:50%;border:1px solid #d6dbe7;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.lesson-check.done {background:#dcf7e8;border-color:#b9e9cf;color:var(--green)}
.lesson-row strong {display:block;font-size:14px}
.lesson-row small {display:block;color:var(--muted);font-size:12px;margin-top:3px}
.lesson-row .arrow {margin-left:auto;color:var(--muted)}
.lesson-content {max-width:850px;margin:auto}
.lesson-nav {display:flex;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.lesson-block {background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:22px;margin:17px 0}
.lesson-block h2 {font-size:20px}
.lesson-block h3 {font-size:16px;margin-bottom:8px}
.math {background:#f5f7ff;border:1px solid #e3e8ff;border-radius:10px;padding:16px;margin:12px 0;text-align:center;font-family:"Cambria Math",Cambria,serif;font-size:clamp(19px,3vw,25px);overflow-wrap:anywhere}
.step {border-left:3px solid #b8c6ff;padding:5px 0 5px 16px;margin:14px 0}
.step strong {display:block;margin-bottom:4px}
.note {padding:13px 15px;border-radius:9px;background:#edf3ff;border-left:4px solid var(--blue);margin:13px 0}
.warning {background:#fff5e8;border-left-color:#d58b24}
.success-note {background:#eaf8f0;border-left-color:var(--green)}
.practice-card {background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}
.answer {display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;margin:9px 0;cursor:pointer}
.answer:hover {background:#f7f8ff;border-color:#b8c5ff}
.answer input {margin-top:6px;accent-color:var(--blue)}
.answer.correct {border-color:#6bc79b;background:#eaf8f0}
.answer.incorrect {border-color:#e7a0a5;background:#fff0f0}
.feedback {padding:14px;border-radius:10px;margin-top:14px;background:#f1f3f8}
.feedback.good {background:#e8f7ef;color:#176744}
.feedback.bad {background:#fff0f0;color:#a82e38}
textarea {width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);color:var(--text)}
input[type=text],input[type=number],select {border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--panel);color:var(--text);max-width:100%}
table {border-collapse:collapse;width:100%;margin:12px 0}
th,td {text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th {background:#f5f6fb;font-size:13px}
details {border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0}
summary {font-weight:700;cursor:pointer}
.hidden {display:none!important}
footer {padding:30px 0;color:var(--muted);font-size:12px}
#toast {position:fixed;bottom:20px;right:20px;background:#192235;color:white;border-radius:10px;padding:12px 17px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
@media(max-width:900px) {
 .app {grid-template-columns:1fr}
 aside {border-right:0;border-bottom:1px solid var(--line);padding:10px;position:static}
 .nav-label,.side-progress {display:none}
 .nav-list {display:flex;overflow-x:auto;gap:5px}
 .nav-btn {width:auto;white-space:nowrap;padding:9px 12px}
 main {padding:22px 15px}
 .grid {grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px) {
 header {padding:0 13px}
 .header-right .hide-mobile {display:none}
 .grid,.two-col {grid-template-columns:1fr}
 .card {padding:17px}
 .lesson-block {padding:17px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-icon">x²</span> Algebra 2 Academy</div>
  <div class="header-right"><span id="header-progress">0% complete</span><span class="hide-mobile">|</span><span id="header-streak">0 day streak</span></div>
</header>
<div class="app">
<aside>
  <div class="nav-label">YOUR LEARNING</div>
  <div class="nav-list">
    <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span> Dashboard</button>
    <button class="nav-btn" data-page="course"><span class="nav-icon">▤</span> Course lessons</button>
    <button class="nav-btn" data-page="practice"><span class="nav-icon">✎</span> Practice</button>
    <button class="nav-btn" data-page="exam"><span class="nav-icon">✓</span> Mock exam</button>
    <button class="nav-btn" data-page="formulas"><span class="nav-icon">π</span> Formula library</button>
    <button class="nav-btn" data-page="notes"><span class="nav-icon">▧</span> My notes</button>
    <button class="nav-btn" data-page="progress"><span class="nav-icon">↗</span> My progress</button>

  <div class="side-progress">
    <div class="row"><strong>Course progress</strong><span id="side-percent">0%</span></div>
    <div class="progress" style="margin:10px 0"><div id="side-bar" style="width:0%"></div></div>
    <div class="muted" id="side-lessons">0 lessons completed</div>
  </div>
</aside>
<main id="main"></main>
</div>
<div id="toast"></div>

<script>
"use strict";

/*
  Algebra 2 CBE Academy
  All progress is stored locally in this browser.
  This is an independent study resource, not an official exam blueprint.
*/

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const KEY = "algebra2cbe_progress_v2";

const units = [
{
 id:"linear",icon:"01",title:"Equations, Inequalities & Linear Functions",level:"Foundations",
 intro:"Build the equation-solving and graphing skills used throughout Algebra 2.",
 lessons:[
 {title:"Solving Equations Step by Step",time:"20 min",objectives:["Solve one-variable linear equations.","Use inverse operations.","Check solutions by substitution."],
 prereq:"A variable is a letter representing a number. An expression such as 3x + 2 combines numbers and variables. An equation states that two expressions are equal.",
 sections:[
 {h:"1. What does solving mean?",p:"Solving an equation means finding every value of the variable that makes the statement true. Think of an equation as a balanced scale: whatever operation you perform on one side, you must perform on the other side to preserve equality.",math:"x + 5 = 12",p2:"The equation says that a number plus 5 equals 12. Subtracting 5 from both sides isolates x."},
 {h:"2. Inverse operations",p:"Inverse operations undo one another. Addition and subtraction are inverses; multiplication and division are inverses. Exponents and roots are also related inverse operations, although they require additional care.",bullets:["Undo addition by subtracting the same amount.","Undo subtraction by adding the same amount.","Undo multiplication by dividing by the same nonzero number.","Undo division by multiplying by the same number." ]},
 {h:"3. Worked example",p:"Solve 3x − 7 = 14. We want x by itself, so reverse the operations surrounding x.",steps:[["Add 7 to both sides","3x − 7 + 7 = 14 + 7, so 3x = 21. Adding 7 cancels the −7."],["Divide both sides by 3","3x ÷ 3 = 21 ÷ 3, so x = 7. Division cancels multiplication by 3."],["Check the answer","Substitute 7 into the original equation: 3(7) − 7 = 21 − 7 = 14. Both sides match, so x = 7 is correct."]]},
 {h:"4. Variables on both sides",p:"When the variable appears on both sides, gather variable terms on one side and constants on the other.",steps:[["Start","5x + 2 = 2x + 14"],["Subtract 2x from both sides","3x + 2 = 14"],["Subtract 2","3x = 12"],["Divide by 3","x = 4. Check: 5(4)+2 = 22 and 2(4)+14 = 22."]]},
 {h:"5. Common mistakes",bullets:["Changing a sign mentally without performing the same operation on both sides.","Dividing only one term instead of the entire side.","Forgetting to distribute a number outside parentheses.","Not checking the answer in the original equation."]},
 {h:"6. Why this matters",p:"These same steps appear when solving formulas, finding intercepts, simplifying rational equations, and solving systems. Reliable equation-solving makes more advanced topics easier."}
 ],
 examples:[{q:"Solve 2x + 9 = 19.",a:"x = 5",steps:["Subtract 9: 2x = 10.","Divide by 2: x = 5.","Check: 2(5)+9 = 19."]}],
 questions:[
 {q:"Solve 4x − 3 = 17.",options:["x = 4","x = 5","x = 6","x = 20"],correct:1,why:"Add 3 to get 4x = 20. Divide by 4 to get x = 5."},
 {q:"Solve 2x + 8 = x + 13.",options:["x = 3","x = 5","x = 8","x = 21"],correct:1,why:"Subtract x from both sides: x + 8 = 13. Subtract 8, giving x = 5."},
 {q:"Which operation undoes multiplication by 7?",options:["Add 7","Subtract 7","Divide by 7","Square the number"],correct:2,why:"Dividing by 7 undoes multiplication by 7."}
 ]},
 {title:"Inequalities and Interval Reasoning",time:"20 min",objectives:["Solve linear inequalities.","Interpret inequality symbols.","Understand when to reverse the inequality sign."],
 prereq:"An inequality compares values rather than saying they are exactly equal. The symbols < and > mean less than and greater than; ≤ and ≥ include equality.",
 sections:[
 {h:"1. Reading inequalities",p:"The statement x < 4 means every number smaller than 4 is a solution. The number 4 itself is not included. The statement x ≤ 4 includes 4 as well as all smaller numbers.",math:"x < 4     means     all numbers below 4"},
 {h:"2. Solving inequalities",p:"You can add or subtract the same number on both sides, and multiply or divide by a positive number, without changing the direction of the inequality.",steps:[["Start","2x + 3 < 11"],["Subtract 3","2x < 8"],["Divide by positive 2","x < 4"]]},
 {h:"3. The important sign reversal",p:"If you multiply or divide both sides by a negative number, reverse the inequality sign. This is necessary because negative numbers reverse order on the number line: −2 is greater than −5.",steps:[["Start","−3x < 12"],["Divide by −3","x > −4"],["Check","Try x = 0. The original inequality becomes 0 < 12, which is true."]]},
 {h:"4. Graphing solutions",p:"Use an open circle when the endpoint is excluded (< or >). Use a filled circle when it is included (≤ or ≥). Shade toward the values that satisfy the inequality.",bullets:["x < 3: open circle at 3; shade left.","x ≥ −2: filled circle at −2; shade right."]},
 {h:"5. Common mistakes",bullets:["Forgetting to reverse the sign after dividing by a negative number.","Using a filled endpoint for a strict inequality.","Assuming an inequality has only one solution; it often has infinitely many."]}
 ],
 questions:[
 {q:"Solve 3x − 4 ≥ 11.",options:["x ≥ 5","x ≤ 5","x ≥ 7/3","x ≤ 7/3"],correct:0,why:"Add 4: 3x ≥ 15. Divide by positive 3: x ≥ 5."},
 {q:"Solve −2x > 10.",options:["x > −5","x < −5","x > 5","x < 5"],correct:1,why:"Divide by −2 and reverse the sign. Therefore x < −5."},
 {q:"Which endpoint is included in x ≤ 6?",options:["6 is not included","6 is included","Only numbers above 6","There are no solutions"],correct:1,why:"The symbol ≤ means less than or equal to, so 6 is included."}
 ]},
 {title:"Linear Functions and Slope",time:"25 min",objectives:["Find slope from two points.","Interpret slope and y-intercept.","Write a line in slope-intercept form."],
 prereq:"A function assigns an output to an input. Coordinates are written (x, y), where x is horizontal and y is vertical.",
 sections:[
 {h:"1. What is slope?",p:"Slope measures how much y changes when x increases by one unit. It is often described as rise over run: vertical change divided by horizontal change.",math:"m = (y₂ − y₁) / (x₂ − x₁)",p2:"A positive slope rises from left to right. A negative slope falls. A horizontal line has slope 0. A vertical line has undefined slope."},
 {h:"2. Example using two points",p:"Find the slope through (2, 3) and (6, 11). Label the first point (x₁,y₁) and the second (x₂,y₂).",steps:[["Find vertical change","11 − 3 = 8."],["Find horizontal change","6 − 2 = 4."],["Divide","m = 8/4 = 2. The line rises 2 units for every 1 unit to the right."]]},
 {h:"3. Slope-intercept form",p:"The equation y = mx + b describes a line. The number m is the slope, and b is the y-intercept, where the line crosses the vertical axis.",math:"y = mx + b",p2:"For y = 3x − 4, the slope is 3 and the y-intercept is −4, or the point (0, −4)."},
 {h:"4. Writing an equation",p:"Suppose a line has slope 2 and y-intercept 5. Substitute m = 2 and b = 5 into y = mx + b to get y = 2x + 5.",steps:[["Identify the slope","m = 2."],["Identify the intercept","b = 5."],["Substitute","y = 2x + 5."]]},
 {h:"5. Common mistakes",bullets:["Subtracting the coordinates in different orders in the numerator and denominator.","Confusing the y-intercept with the x-intercept.","Assuming a larger slope means the line starts higher; slope and intercept describe different things."]}
 ],
 questions:[
 {q:"Find the slope through (1, 2) and (3, 8).",options:["2","3","4","6"],correct:1,why:"Slope = (8−2)/(3−1) = 6/2 = 3."},
 {q:"In y = −4x + 7, what is the y-intercept?",options:["−4","4","7","−7"],correct:2,why:"In y = mx + b, b is the y-intercept. Here b = 7."},
 {q:"A line has slope 2 and y-intercept −3. Which equation describes it?",options:["y = −3x + 2","y = 2x − 3","y = 2x + 3","y = −2x − 3"],correct:1,why:"Substitute m = 2 and b = −3 into y = mx + b."}
 ]}
 ]
},
{
 id:"quadratics",icon:"02",title:"Quadratic Equations & Functions",level:"Core",
 intro:"Understand parabolas, multiple solution methods, and quadratic applications.",
 lessons:[
 {title:"Understanding Quadratic Equations",time:"25 min",objectives:["Recognize quadratic equations.","Identify a, b, and c.","Explain why quadratic graphs are parabolas."],
 prereq:"A linear equation has x to the first power, such as y = 2x + 3. A quadratic has x² as its highest power after simplifying.",
 sections:[
 {h:"1. Definition and standard form",p:"A quadratic equation has degree 2. Its standard form is ax² + bx + c = 0, where a, b, and c are numbers and a cannot be zero. The degree is the largest exponent of the variable after simplifying.",math:"ax² + bx + c = 0",p2:"The coefficient a multiplies x², b multiplies x, and c is the constant term. Signs are part of coefficients."},
 {h:"2. Identify coefficients",p:"For 3x² − 5x + 2 = 0, compare each term with the standard form.",steps:[["Quadratic term","3x² means a = 3."],["Linear term","−5x means b = −5, including the negative sign."],["Constant term","The constant is 2, so c = 2."]]},
 {h:"3. Missing terms",p:"For x² − 16 = 0, there is no x term. Rewrite it as x² + 0x − 16 = 0. Therefore a = 1, b = 0, and c = −16. A missing term has a coefficient of zero.",p2:"For 2x² + 8x = 0, the constant term is missing, so c = 0."},
 {h:"4. Why a parabola?",p:"The graph of y = ax² + bx + c is a parabola. For y = x², outputs at x = −2 and x = 2 are both 4, and outputs at x = −1 and x = 1 are both 1. This symmetry creates a U-shaped graph.",math:"y = x²:  4, 1, 0, 1, 4",p2:"If a is positive, the parabola opens upward. If a is negative, it opens downward. The vertex is its lowest or highest point."},
 {h:"5. Common mistakes",bullets:["Forgetting the negative sign in b.","Calling an expression an equation when it has no equals sign.","Assuming a missing x term makes an equation invalid.","Not simplifying before identifying the degree."]},
 {h:"6. Where quadratics appear",p:"Quadratic models describe many situations involving curved paths, area, and maximum or minimum values. In applications, the vertex may represent the maximum height of a projectile or the greatest possible area."}
 ],
 examples:[{q:"Identify a, b, and c in 2x² + 6x − 8 = 0.",a:"a = 2, b = 6, c = −8",steps:["The coefficient of x² is 2.","The coefficient of x is 6.","The constant term is −8."]}],
 questions:[
 {q:"For 4x² − 9x + 2 = 0, what is b?",options:["9","−9","4","2"],correct:1,why:"The coefficient of x is −9. Keep the sign."},
 {q:"Which equation is quadratic?",options:["3x + 1 = 0","x² − 4 = 0","x³ + 1 = 0","5x = 10"],correct:1,why:"The highest power of x is 2."},
 {q:"For y = −3x² + 4x + 1, which way does the parabola open?",options:["Upward","Downward","It is a straight line","Cannot be determined"],correct:1,why:"The coefficient of x² is negative, so the parabola opens downward."}
 ]},
 {title:"Factoring Quadratics",time:"30 min",objectives:["Factor simple quadratic expressions.","Use the zero-product property.","Solve quadratics by factoring."],
 prereq:"Factoring reverses expansion. For example, x(x + 4) expands to x² + 4x. Factoring writes an expression as a product.",
 sections:[
 {h:"1. What factoring does",p:"Factoring rewrites a sum or difference as a multiplication expression. For x² + 5x + 6, look for two numbers whose product is 6 and whose sum is 5. Those numbers are 2 and 3.",math:"x² + 5x + 6 = (x + 2)(x + 3)",p2:"You can verify the result by expanding: x² + 3x + 2x + 6 = x² + 5x + 6."},
 {h:"2. The zero-product property",p:"If two factors multiply to zero, at least one factor must be zero. This lets us turn one quadratic equation into two simpler equations.",math:"AB = 0  ⇒  A = 0 or B = 0",p2:"This rule works because a nonzero number multiplied by another nonzero number cannot produce zero."},
 {h:"3. Worked example",p:"Solve x² + 5x + 6 = 0.",steps:[["Factor","(x + 2)(x + 3) = 0."],["Set the first factor to zero","x + 2 = 0, so x = −2."],["Set the second factor to zero","x + 3 = 0, so x = −3."],["State both solutions","x = −2 or x = −3."]]},
 {h:"4. Factoring when a is not 1",p:"For 2x² + 7x + 3, one possible factorization is (2x + 1)(x + 3). Check the outer and inner products: 6x and x combine to 7x, while the first and last products give 2x² and 3.",math:"2x² + 7x + 3 = (2x + 1)(x + 3)",p2:"Set each factor equal to zero to solve: 2x + 1 = 0 gives x = −1/2; x + 3 = 0 gives x = −3."},
 {h:"5. Common mistakes",bullets:["Finding numbers that add correctly but do not multiply to the constant.","Forgetting that the factor equations are separated by OR, not AND.","Only reporting one solution when both factors can equal zero.","Changing signs incorrectly when solving each factor."]}
 ],
 questions:[
 {q:"Factor x² + 7x + 12.",options:["(x + 3)(x + 4)","(x + 2)(x + 6)","(x − 3)(x − 4)","(x + 1)(x + 12)"],correct:0,why:"3 and 4 multiply to 12 and add to 7."},
 {q:"Solve (x − 5)(x + 2) = 0.",options:["x = 5 only","x = −2 only","x = 5 or x = −2","x = 3 or x = −3"],correct:2,why:"Set each factor equal to zero: x−5=0 gives 5; x+2=0 gives −2."},
 {q:"Which is the factorization of x² − 9?",options:["(x − 9)(x + 1)","(x − 3)(x + 3)","(x − 3)²","(x + 9)(x − 1)"],correct:1,why:"This is a difference of squares: x²−3² = (x−3)(x+3)."}
 ]},
 {title:"Completing the Square and Square Roots",time:"30 min",objectives:["Solve quadratics using square roots.","Complete the square.","Convert to vertex form."],
 prereq:"A perfect-square expression such as (x + 3)² expands to x² + 6x + 9. Completing the square uses this pattern.",
 sections:[
 {h:"1. Solving by square roots",p:"If an equation has the form (x − h)² = k, take square roots of both sides. When k is positive, include both the positive and negative square roots.",math:"(x − h)² = k  ⇒  x − h = ±√k",p2:"The ± symbol is essential: both a positive number and its negative have the same square."},
 {h:"2. Example",p:"Solve (x − 4)² = 25.",steps:[["Take square roots","x − 4 = ±5."],["Use the positive root","x − 4 = 5, so x = 9."],["Use the negative root","x − 4 = −5, so x = −1."],["Answer","x = 9 or x = −1."]]},
 {h:"3. Completing the square",p:"To complete the square for x² + bx, take half of b and square it. Add that number to create a perfect-square trinomial. For x² + 6x, half of 6 is 3 and 3² = 9.",math:"x² + 6x + 9 = (x + 3)²",p2:"If you add a number to one side of an equation, you must add it to the other side too."},
 {h:"4. Worked example",p:"Solve x² + 6x + 2 = 0 by completing the square.",steps:[["Move the constant","x² + 6x = −2."],["Add the square term to both sides","Half of 6 is 3; square it to get 9. So x² + 6x + 9 = 7."],["Factor the perfect square","(x + 3)² = 7."],["Take square roots","x + 3 = ±√7, so x = −3 ± √7."]]},
 {h:"5. Vertex form",p:"Vertex form is y = a(x − h)² + k. Its vertex is (h, k). Notice the sign inside the parentheses is opposite the x-coordinate: (x − 4)² has h = 4.",math:"y = a(x − h)² + k"},
 {h:"6. Common mistakes",bullets:["Forgetting ± when taking a square root.","Adding a number to only one side of an equation.","Using b² instead of (b/2)² when completing the square.","Reading the sign of h incorrectly in vertex form."]}
 ],
 questions:[
 {q:"Solve (x + 2)² = 16.",options:["x = 2 only","x = −6 or x = 2","x = −2 or x = 4","x = 6 or x = −2"],correct:1,why:"x+2 = ±4, so x = 2 or x = −6."},
 {q:"What number completes x² + 8x + __ as a perfect square?",options:["4","8","16","64"],correct:2,why:"Half of 8 is 4; 4² = 16."},
 {q:"What is the vertex of y = (x − 5)² + 2?",options:["(−5, 2)","(5, 2)","(2, 5)","(5, −2)"],correct:1,why:"Compare with y = (x−h)²+k. The vertex is (h,k) = (5,2)."}
 ]},
 {title:"The Quadratic Formula and Discriminant",time:"30 min",objectives:["Use the quadratic formula.","Interpret the discriminant.","Determine the number of real solutions."],
 prereq:"The standard form is ax² + bx + c = 0. The quadratic formula works for every quadratic equation with a ≠ 0.",
 sections:[
 {h:"1. The formula",p:"When factoring is difficult or does not work with integers, use the quadratic formula. Identify a, b, and c from standard form before substituting.",math:"x = (−b ± √(b² − 4ac)) / (2a)",p2:"The entire numerator is divided by 2a. Use parentheses carefully when substituting negative values."},
 {h:"2. Worked example",p:"Solve x² − 5x + 6 = 0 using the formula.",steps:[["Identify coefficients","a = 1, b = −5, c = 6."],["Substitute","x = (−(−5) ± √((−5)² − 4(1)(6))) / 2."],["Simplify","x = (5 ± √(25 − 24))/2 = (5 ± 1)/2."],["Find both answers","x = 3 or x = 2."]]},
 {h:"3. The discriminant",p:"The expression under the square root, b² − 4ac, is called the discriminant. Its sign tells you how many real solutions a quadratic has.",math:"D = b² − 4ac",bullets:["D > 0: two distinct real solutions.","D = 0: one repeated real solution.","D < 0: no real solutions (the roots are complex)."]},
 {h:"4. Example of no real solutions",p:"For x² + 1 = 0, a = 1, b = 0, and c = 1. The discriminant is 0² − 4(1)(1) = −4. Since it is negative, the equation has no real solutions. Over complex numbers, the solutions are i and −i.",p2:"For many Algebra 2 questions, the key skill is identifying that a negative discriminant means there are no real roots."},
 {h:"5. Common mistakes",bullets:["Using b instead of −b in the numerator.","Forgetting to square a negative b using parentheses.","Dividing only the square-root term by 2a.","Treating a negative discriminant as a real square root."]}
 ],
 questions:[
 {q:"For x² − 6x + 5 = 0, what is b?",options:["6","−6","5","1"],correct:1,why:"The coefficient of x is −6."},
 {q:"What does a discriminant of 0 mean?",options:["No real solutions","Two distinct real solutions","One repeated real solution","Infinite solutions"],correct:2,why:"A zero discriminant makes the ± square-root term zero, so both answers are the same."},
 {q:"What is the discriminant of x² + 2x + 5 = 0?",options:["24","−16","16","−24"],correct:1,why:"D = 2² − 4(1)(5) = 4 − 20 = −16."}
 ]}
 ]
},
{
 id:"polynomials",icon:"03",title:"Polynomial Expressions & Functions",level:"Core",
 intro:"Work with polynomial terms, products, factoring, and polynomial graphs.",
 lessons:[
 {title:"Polynomial Vocabulary and Operations",time:"25 min",objectives:["Identify degree and leading coefficient.","Combine like terms.","Add and subtract polynomials."],
 prereq:"Like terms have the same variable raised to the same power. For example, 3x² and −5x² are like terms, but x² and x are not.",
 sections:[
 {h:"1. What is a polynomial?",p:"A polynomial is a sum of terms with nonnegative integer exponents. Examples include 3x² − 2x + 7 and 4x⁴ + x. Expressions with variables in denominators or negative/fractional exponents are not polynomials in x.",math:"4x³ − 2x² + 7x − 1"},
 {h:"2. Degree and leading coefficient",p:"The degree is the largest exponent with a nonzero coefficient. The leading coefficient is the coefficient of the highest-degree term when the polynomial is written in descending powers.",steps:[["Example","−5x⁴ + 2x² − 7"],["Degree","The largest exponent is 4."],["Leading coefficient","The coefficient of −5x⁴ is −5."]]},
 {h:"3. Adding polynomials",p:"Combine like terms only. The expression (3x² + 2x + 1) + (x² − 5x + 4) becomes 4x² − 3x + 5. Add the coefficients of matching powers.",steps:[["Group x² terms","3x² + x² = 4x²."],["Group x terms","2x − 5x = −3x."],["Group constants","1 + 4 = 5."],["Final result","4x² − 3x + 5."]]},
 {h:"4. Subtracting polynomials",p:"When subtracting a polynomial, distribute the negative sign to every term in the second expression before combining like terms.",math:"(3x² + 2x) − (x² − 4x) = 2x² + 6x",p2:"The subtraction changes −4x to +4x because −(−4x) = +4x."},
 {h:"5. Common mistakes",bullets:["Combining unlike terms such as x² and x.","Forgetting to distribute a negative sign across every term.","Identifying the degree from the first term before arranging terms in descending powers."]}
 ],
 questions:[
 {q:"What is the degree of 7x⁵ − 2x² + 9?",options:["2","3","5","9"],correct:2,why:"The highest exponent is 5."},
 {q:"Simplify (2x² + 3x) + (4x² − x).",options:["6x² + 2x","6x² + 4x","2x² + 2x","6x⁴ + 2x"],correct:0,why:"2x² + 4x² = 6x², and 3x − x = 2x."},
 {q:"What is the leading coefficient of −3x⁴ + 8x − 1?",options:["4","−3","8","−1"],correct:1,why:"The highest-degree term is −3x⁴, so the leading coefficient is −3."}
 ]},
 {title:"Multiplying and Factoring Polynomials",time:"30 min",objectives:["Multiply polynomials using distribution.","Recognize special products.","Factor out a greatest common factor."],
 prereq:"The distributive property says a(b + c) = ab + ac. Multiplying polynomials uses this rule repeatedly.",
 sections:[
 {h:"1. Multiply a monomial by a polynomial",p:"Multiply the outside term by every term inside the parentheses.",math:"3x(x² + 2x − 4) = 3x³ + 6x² − 12x",p2:"For powers with the same base, xᵐ · xⁿ = xᵐ⁺ⁿ. Thus x · x² = x³."},
 {h:"2. Multiply two binomials",p:"A binomial has two terms. Multiply each term in the first binomial by each term in the second, then combine like terms.",steps:[["Write the product","(x + 2)(x + 5)."],["Distribute x","x(x + 5) = x² + 5x."],["Distribute 2","2(x + 5) = 2x + 10."],["Combine","x² + 5x + 2x + 10 = x² + 7x + 10."]]},
 {h:"3. Special products",p:"Three patterns are especially useful.",math:"(a + b)² = a² + 2ab + b²",math2:"(a − b)² = a² − 2ab + b²",math3:"(a + b)(a − b) = a² − b²",p2:"The square of a binomial includes the middle term 2ab. Do not simply square each term and omit it."},
 {h:"4. Greatest common factor",p:"Before trying other factoring methods, check whether every term shares a factor. For 6x³ + 9x², both coefficients share 3 and both terms contain x².",steps:[["Find the common factor","The greatest common factor is 3x²."],["Divide each term","6x³ ÷ 3x² = 2x; 9x² ÷ 3x² = 3."],["Factor","6x³ + 9x² = 3x²(2x + 3)."]]},
 {h:"5. Common mistakes",bullets:["Multiplying only the first terms in a pair of binomials.","Forgetting the middle term in a squared binomial.","Not checking for a common factor before factoring further.","Adding exponents when adding terms rather than multiplying powers."]}
 ],
 questions:[
 {q:"Expand (x + 3)(x + 4).",options:["x² + 7x + 12","x² + 12x + 7","x² + 7","x² + 12"],correct:0,why:"Multiply to get x² + 4x + 3x + 12, then combine the middle terms."},
 {q:"Factor 8x² + 12x.",options:["4x(2x + 3)","4x²(2 + 3)","2x(4x + 12)","8x(x + 12)"],correct:0,why:"The greatest common factor is 4x."},
 {q:"Expand (x − 2)².",options:["x² + 4","x² − 4x + 4","x² − 2x + 4","x² + 4x + 4"],correct:1,why:"(x−2)(x−2) = x² − 2x − 2x + 4."}
 ]}
 ]
},
{
 id:"rational",icon:"04",title:"Rational Expressions & Equations",level:"Core",
 intro:"Simplify fractions with variables and solve rational equations while checking restrictions.",
 lessons:[
 {title:"Simplifying Rational Expressions",time:"25 min",objectives:["Factor numerator and denominator.","Cancel common factors.","Identify excluded values."],
 prereq:"A rational expression is a ratio of polynomials. Just like numerical fractions, it can be simplified by canceling common factors—but a denominator can never equal zero.",
 sections:[
 {h:"1. What is a rational expression?",p:"A rational expression is a fraction whose numerator and denominator are polynomials.",math:"(x² − 9) / (x + 3)",p2:"The original denominator cannot be zero. Since x + 3 = 0 when x = −3, the original expression is undefined at x = −3."},
 {h:"2. Factor before canceling",p:"The expression x² − 9 factors as (x − 3)(x + 3). This is a difference of squares: a² − b² = (a − b)(a + b).",steps:[["Rewrite the numerator","(x − 3)(x + 3) / (x + 3)."],["Cancel the common factor","The factor x + 3 cancels, leaving x − 3."],["Keep the restriction","The simplified expression equals x − 3 only for x ≠ −3."]]},
 {h:"3. What can and cannot cancel?",p:"You can cancel common factors, not separate terms in a sum. For example, (x² + 3x)/x can be simplified because the numerator factors as x(x + 3). But x + 3 over x cannot be simplified by canceling the x in just one term.",math:"(x² + 3x)/x = x + 3,   x ≠ 0"},
 {h:"4. Common mistakes",bullets:["Canceling terms instead of entire factors.","Forgetting values excluded by the original denominator.","Multiplying fractions by adding denominators.","Dividing by an expression without considering whether it could equal zero."]}
 ],
 questions:[
 {q:"Simplify (x² − 16)/(x − 4), where x ≠ 4.",options:["x − 4","x + 4","x² + 4","x − 16"],correct:1,why:"Factor x²−16 = (x−4)(x+4), then cancel x−4."},
 {q:"For 5/(x − 2), which value is excluded?",options:["x = 0","x = 2","x = 5","x = −2"],correct:1,why:"The denominator is zero when x−2 = 0, so x = 2 is excluded."},
 {q:"Simplify (x² + 4x)/x for x ≠ 0.",options:["x + 4","x² + 4","x + 4x","x"],correct:0,why:"Factor the numerator as x(x+4), then cancel the common factor x."}
 ]},
 {title:"Solving Rational Equations",time:"30 min",objectives:["Clear denominators using a common denominator.","Solve the resulting equation.","Check for extraneous solutions."],
 prereq:"A rational equation contains fractions with variables in denominators. Any value that makes an original denominator zero is forbidden.",
 sections:[
 {h:"1. Why clear denominators?",p:"Fractions can make equations difficult to solve. Multiplying every term by the least common denominator (LCD) removes the fractions, provided you respect the original restrictions.",math:"1/x + 1/2 = 1",p2:"Here x cannot equal zero. The LCD is 2x."},
 {h:"2. Worked example",p:"Solve 1/x + 1/2 = 1.",steps:[["Find the restriction and LCD","x ≠ 0; the LCD is 2x."],["Multiply every term by 2x","2 + x = 2x."],["Solve","Subtract x: 2 = x."],["Check the original equation","1/2 + 1/2 = 1. The solution x = 2 is allowed."]]},
 {h:"3. Extraneous solutions",p:"An extraneous solution is a value that appears while solving but does not satisfy the original equation or violates an original restriction. Always check proposed answers in the original equation.",steps:[["Example","(x − 1)/(x − 1) = 2."],["Restriction","x ≠ 1."],["Simplify","For every allowed x, the left side equals 1, so it cannot equal 2."],["Conclusion","There is no solution. The excluded value x = 1 cannot be used to rescue the equation."]]},
 {h:"4. Common mistakes",bullets:["Multiplying only one fraction by the LCD.","Ignoring values that make an original denominator zero.","Accepting every algebraic result without checking it.","Losing a term when distributing the LCD."]}
 ],
 questions:[
 {q:"Solve 1/x = 1/4.",options:["x = 0","x = 1/4","x = 4","x = −4"],correct:2,why:"Cross multiplication or multiplying both sides by 4x gives x = 4."},
 {q:"Why must denominator restrictions be checked?",options:["To make the answer larger","A denominator cannot equal zero","To remove every variable","To change fractions to decimals"],correct:1,why:"Division by zero is undefined, so those values cannot be solutions."},
 {q:"For 3/(x + 5), which value is not allowed?",options:["5","−5","0","3"],correct:1,why:"x + 5 = 0 when x = −5."}
 ]}
 ]
},
{
 id:"radicals",icon:"05",title:"Radicals, Rational Exponents & Complex Numbers",level:"Core",
 intro:"Simplify roots, use rational exponents, and understand imaginary numbers.",
 lessons:[
 {title:"Simplifying Radicals and Rational Exponents",time:"25 min",objectives:["Simplify square roots.","Use exponent rules.","Convert between radicals and rational exponents."],
 prereq:"A square root asks which nonnegative number squares to a given nonnegative number. Since 5² = 25, √25 = 5.",
 sections:[
 {h:"1. Perfect squares",p:"A perfect square is the square of an integer, such as 1, 4, 9, 16, 25, or 36. To simplify a radical, look for a perfect-square factor inside the radical.",math:"√72 = √(36 · 2) = 6√2",p2:"The square root of a product equals the product of the square roots when the quantities are nonnegative."},
 {h:"2. Simplifying step by step",p:"Simplify √50.",steps:[["Find a perfect-square factor","50 = 25 · 2."],["Separate the roots","√50 = √25 · √2."],["Evaluate the perfect square","√25 = 5, so √50 = 5√2."]]},
 {h:"3. Rational exponents",p:"A fractional exponent represents a root. The denominator tells you which root to take; the numerator tells you which power to raise it to.",math:"x^(1/2) = √x",math2:"x^(1/3) = ∛x",math3:"x^(m/n) = ⁿ√(xᵐ)",p2:"For real-valued even roots, the expression under the root must be nonnegative."},
 {h:"4. Exponent rules",bullets:["Product: xᵃ · xᵇ = xᵃ⁺ᵇ.","Quotient: xᵃ / xᵇ = xᵃ⁻ᵇ, when x ≠ 0.","Power of a power: (xᵃ)ᵇ = xᵃᵇ.","Zero exponent: x⁰ = 1 for x ≠ 0.","Negative exponent: x⁻ᵃ = 1/xᵃ for x ≠ 0."]},
 {h:"5. Common mistakes",bullets:["Writing √(a+b) = √a + √b; this is generally false.","Confusing x^(1/3) with x^(1/2).","Forgetting that negative exponents indicate reciprocals, not negative values.","Ignoring restrictions for even roots and denominators."]}
 ],
 questions:[
 {q:"Simplify √48.",options:["4√3","3√4","8√6","2√12"],correct:0,why:"48 = 16·3, so √48 = 4√3."},
 {q:"Which expression equals x^(1/3)?",options:["x/3","√x","∛x","3x"],correct:2,why:"A denominator of 3 in the exponent means cube root."},
 {q:"Simplify x³ · x⁴.",options:["x¹²","x⁷","2x⁷","x"],correct:1,why:"When multiplying powers with the same base, add exponents: 3+4=7."}
 ]},
 {title:"Complex Numbers",time:"25 min",objectives:["Define i.","Simplify powers of i.","Add and multiply complex numbers."],
 prereq:"No real number squared equals −1. Algebra extends the number system by defining i as the square root of −1.",
 sections:[
 {h:"1. The imaginary unit",p:"The imaginary unit i is defined by i² = −1. This allows square roots of negative numbers to be expressed using complex numbers.",math:"i = √(−1),     i² = −1",p2:"For example, √(−9) = √9 · √(−1) = 3i."},
 {h:"2. Standard form",p:"A complex number is written a + bi, where a is the real part and b is the coefficient of the imaginary part. Real numbers have b = 0; pure imaginary numbers have a = 0.",math:"a + bi"},
 {h:"3. Powers of i",p:"Powers of i repeat in a cycle of four because i² = −1, i³ = −i, and i⁴ = 1.",math:"i, −1, −i, 1, i, −1, …",p2:"To simplify a large power, divide its exponent by 4 and use the remainder to find the position in the cycle."},
 {h:"4. Operations",p:"Add real parts together and imaginary parts together. For multiplication, distribute and replace every i² with −1.",steps:[["Addition","(3 + 2i) + (4 − 5i) = 7 − 3i."],["Multiplication","(2 + i)(3 + i) = 6 + 2i + 3i + i² = 5 + 5i."]]},
 {h:"5. Common mistakes",bullets:["Treating i² as positive 1.","Combining a real term with an imaginary term.","Forgetting to distribute every term when multiplying complex numbers."]}
 ],
 questions:[
 {q:"What is i²?",options:["1","−1","i","−i"],correct:1,why:"By definition, i² = −1."},
 {q:"Simplify √(−25).",options:["5","−5","5i","25i"],correct:2,why:"√(−25) = √25 · √(−1) = 5i."},
 {q:"Simplify (2 + 3i) + (4 − i).",options:["6 + 2i","6 + 4i","2 + 2i","8 + 3i"],correct:0,why:"Add real parts: 2+4=6. Add imaginary parts: 3i−i=2i."}
 ]}
 ]
},
{
 id:"exponential",icon:"06",title:"Exponential & Logarithmic Functions",level:"Core",
 intro:"Model growth and decay, understand logarithms, and solve exponential equations.",
 lessons:[
 {title:"Exponential Growth and Decay",time:"25 min",objectives:["Recognize exponential models.","Calculate growth and decay.","Interpret initial values and rates."],
 prereq:"A power such as 2³ means 2 multiplied by itself three times. In an exponential function, the variable appears in the exponent.",
 sections:[
 {h:"1. Exponential functions",p:"An exponential function commonly has the form y = a·bˣ. The initial value is a, and the base b controls growth or decay.",math:"y = a · bˣ",bullets:["If b > 1, the function grows as x increases.","If 0 < b < 1, the function decays as x increases.","The base must be positive for the usual real-valued exponential model."]},
 {h:"2. Growth example",p:"A population starts at 100 and grows by 10% per year. Each year it becomes 110% of the previous amount, so the growth factor is 1 + 0.10 = 1.10.",math:"P(t) = 100(1.10)ᵗ",p2:"After 3 years, P(3) = 100(1.10)³ = 133.1. The model predicts about 133 individuals if the quantity represents a count."},
 {h:"3. Decay example",p:"A machine loses 20% of its value each year. It retains 80% each year, so the factor is 1 − 0.20 = 0.80.",math:"V(t) = 500(0.80)ᵗ",p2:"After two years, V(2) = 500(0.8)² = 320. The amount is multiplied by 0.8 twice."},
 {h:"4. Compound interest",p:"For interest compounded a fixed number of times per year, use A = P(1 + r/n)ⁿᵗ, where P is the starting amount, r is the annual interest rate as a decimal, n is the number of compounding periods per year, and t is time in years.",math:"A = P(1 + r/n)ⁿᵗ",p2:"Convert 5% to 0.05 before substituting. The exponent n·t counts the total number of compounding periods."},
 {h:"5. Common mistakes",bullets:["Using 0.10 as the growth factor instead of 1.10 for 10% growth.","Using 1.20 for a 20% decay instead of 0.80.","Entering a percent as a whole number in a formula requiring a decimal.","Confusing the initial value with the growth factor."]}
 ],
 questions:[
 {q:"A quantity starts at 200 and grows by 5%. What is its yearly multiplier?",options:["0.05","0.95","1.05","5"],correct:2,why:"Growth factor = 1 + 0.05 = 1.05."},
 {q:"A $100 item loses 30% of its value. What is its new value?",options:["$30","$70","$130","$100"],correct:1,why:"It retains 70%, so 100 × 0.70 = $70."},
 {q:"In y = 7(3)ˣ, what is the initial value?",options:["3","7","10","x"],correct:1,why:"At x = 0, y = 7·3⁰ = 7."}
 ]},
 {title:"Logarithms and Their Properties",time:"30 min",objectives:["Convert between exponential and logarithmic form.","Evaluate simple logarithms.","Use log rules to expand and condense expressions."],
 prereq:"A logarithm answers the question: what exponent is needed? Since 2³ = 8, log₂(8) = 3.",
 sections:[
 {h:"1. What is a logarithm?",p:"A logarithm is the inverse of exponentiation. The expression log_b(x) = y means that b raised to y equals x. The base b must be positive and not equal to 1, and x must be positive for real logarithms.",math:"log_b(x) = y  ⇔  bʸ = x"},
 {h:"2. Convert forms",p:"The equation 10² = 100 becomes log₁₀(100) = 2. Both statements describe the same relationship.",steps:[["Start with exponential form","3⁴ = 81."],["Identify the base","The base is 3."],["Rewrite in logarithmic form","log₃(81) = 4."]]},
 {h:"3. Evaluate simple logs",p:"To find log₂(32), ask what power of 2 equals 32. Since 2⁵ = 32, the logarithm equals 5.",math:"log₂(32) = 5",p2:"The common logarithm uses base 10: log(1000) = 3. The natural logarithm uses base e: ln(e³) = 3."},
 {h:"4. Logarithm properties",p:"For positive x and y, these properties allow logarithmic expressions to be combined or expanded.",bullets:["Product: log_b(xy) = log_b(x) + log_b(y).","Quotient: log_b(x/y) = log_b(x) − log_b(y).","Power: log_b(xᵖ) = p log_b(x)."],p2:"The product rule changes multiplication into addition. The quotient rule changes division into subtraction. The power rule moves the exponent to the front."},
 {h:"5. Solving a simple exponential equation",p:"Solve 2ˣ = 16. Because 16 = 2⁴, the exponents must match, giving x = 4. If both sides cannot easily be written with the same base, logarithms can be used.",steps:[["Same-base approach","2ˣ = 16 = 2⁴."],["Match exponents","x = 4."]]},
 {h:"6. Common mistakes",bullets:["Reversing the base and the argument in a logarithm.","Using log rules on sums, such as claiming log(x+y)=log(x)+log(y). That rule is false.","Taking a logarithm of a nonpositive real number.","Forgetting that a logarithm gives an exponent."]}
 ],
 questions:[
 {q:"Rewrite 5³ = 125 as a logarithm.",options:["log₅(125) = 3","log₃(125) = 5","log₁₂₅(5) = 3","log₅(3) = 125"],correct:0,why:"The base is 5, the result is 125, and the exponent is 3."},
 {q:"Evaluate log₂(8).",options:["2","3","4","8"],correct:1,why:"2³ = 8, so log₂(8) = 3."},
 {q:"Expand log₃(9x).",options:["log₃(9)·log₃(x)","log₃(9)+log₃(x)","log₃(9−x)","log₃(9)/log₃(x)"],correct:1,why:"The product rule changes log of a product into the sum of the logs."}
 ]}
 ]
},
{
 id:"systems",icon:"07",title:"Systems of Equations & Matrices",level:"Core",
 intro:"Solve multiple equations together and interpret intersections and solutions.",
 lessons:[
 {title:"Solving Systems of Equations",time:"25 min",objectives:["Solve systems by substitution.","Solve systems by elimination.","Interpret the number of solutions."],
 prereq:"A solution to an equation makes it true. A solution to a system must make every equation in the system true at the same time.",
 sections:[
 {h:"1. What is a system?",p:"A system contains two or more equations involving the same variables. For two linear equations, the solution is the point where their graphs intersect.",math:"y = x + 1\\ny = −x + 5",p2:"At an intersection, both equations have the same x and y values."},
 {h:"2. Substitution",p:"Substitution replaces one variable with an equivalent expression from another equation.",steps:[["Start","y = x + 1 and x + y = 5."],["Substitute y","Replace y in the second equation: x + (x + 1) = 5."],["Solve for x","2x + 1 = 5, so 2x = 4 and x = 2."],["Find y","y = 2 + 1 = 3. The solution is (2, 3)."]]},
 {h:"3. Elimination",p:"Elimination adds or subtracts equations to remove one variable. Choose the equations or multiply them so that one variable has opposite coefficients.",steps:[["Start","x + y = 7 and x − y = 1."],["Add the equations","2x = 8 because +y and −y cancel."],["Solve","x = 4."],["Substitute","4 + y = 7, so y = 3. The solution is (4, 3)."]]},
 {h:"4. Three possible outcomes",bullets:["One solution: the lines intersect at one point.","No solution: distinct parallel lines never intersect.","Infinitely many solutions: both equations describe the same line."],p2:"For example, x+y=4 and 2x+2y=8 represent the same line, so infinitely many points satisfy both."},
 {h:"5. Common mistakes",bullets:["Changing a sign incorrectly when adding equations.","Finding x but forgetting to find y.","Reporting an ordered pair in the wrong order.","Assuming every system has exactly one solution."]}
 ],
 questions:[
 {q:"Solve x + y = 7 and x − y = 1.",options:["(3, 4)","(4, 3)","(1, 7)","(7, 1)"],correct:1,why:"Add equations to get 2x=8, so x=4. Then y=3."},
 {q:"What does one intersection point mean?",options:["No solution","One solution","Infinitely many solutions","The lines are parallel"],correct:1,why:"The intersection is the single ordered pair that satisfies both equations."},
 {q:"What is the best first step for y = 2x + 1 and x + y = 10?",options:["Substitute 2x+1 for y","Square both equations","Divide both sides by zero","Ignore the first equation"],correct:0,why:"Substitute the expression for y into the other equation."}

function startExam() {
 examQuestions=allQuestions().sort(()=>Math.random()-.5).slice(0,30);
 examAnswers=Array( examQuestions.length ).fill(null);examFinished=false;
 page="exam";renderExam();
}
function renderExam() {
 if(examFinished){renderExamResults();return;}
 const i=window.examIndex||0,q=examQuestions[i];
 if(!q){window.examIndex=0;navigate("exam");return;}
 $("#main").innerHTML=pageHead("MOCK EXAM",`Question ${i+1} of ${examQuestions.length}`,"Mixed-topic assessment. Select the best answer for each question. Check your work before submitting the exam.")+
 `<div class="row" style="margin-bottom:12px"><span class="pill">${examAnswers.filter(x=>x!==null).length} answered</span><span class="pill">Suggested time: 60 minutes</span></div><div class="progress"><div style="width:${(i+1)/examQuestions.length*100}%"></div></div>
 <div class="practice-card"><div class="eyebrow">${esc(q.topicTitle)}</div><h2>${esc(q.q)}</h2>${q.options.map((o,j)=>`<label class="answer"><input type="radio" name="exam-answer" value="${j}" ${examAnswers[i]===j?"checked":""}><span>${esc(o)}</span></label>`).join("")}
 <div class="row" style="margin-top:20px"><button class="btn" id="exam-prev" ${i===0?"disabled":""}>← Previous</button><button class="btn" id="exam-next">${i===examQuestions.length-1?"Review answers":"Next →"}</button></div></div>
 <div class="card"><h3>Question navigator</h3><div class="row">${examQuestions.map((_,j)=>`<button class="btn ${examAnswers[j]!==null?"soft":""}" data-exam-index="${j}">${j+1}</button>`).join("")}</div><p class="muted small">Your answers are kept while you navigate. This mock exam has no enforced timer.</p><button class="btn primary" style="margin-top:12px" id="submit-exam">Submit mock exam</button></div>`;
 $('input[name="exam-answer"]')?.addEventListener("change",e=>{examAnswers[i]=+e.target.value;renderExam();});
 $("#exam-prev").onclick=()=>{window.examIndex=i-1;renderExam();};
 $("#exam-next").onclick=()=>{window.examIndex=Math.min(i+1,examQuestions.length-1);renderExam();};
 $$("[data-exam-index]").forEach(b=>b.onclick=()=>{window.examIndex=+b.dataset.examIndex;renderExam();});
 $("#submit-exam").onclick=()=>{
  if(examAnswers.some(a=>a===null)&&!confirm("Some questions are unanswered. Submit anyway?"))return;
  examFinished=true;renderExamResults();
 };
}
function renderExamResults() {
 const correct=examQuestions.filter((q,i)=>examAnswers[i]===q.correct).length;
 const score=Math.round(correct/examQuestions.length*100);
 state.scores.push({date:today(),type:"Mock exam",score,correct,total:examQuestions.length});
 examQuestions.forEach((q,i)=>{if(examAnswers[i]!==q.correct)state.weakTopics[q.topic]=(state.weakTopics[q.topic]||0)+1;});
 recordStudy();save();
 $("#main").innerHTML=pageHead("MOCK EXAM RESULTS","Assessment complete","Use the explanations to identify topics to review before trying another mixed-topic test.")+
 `<div class="card"><div class="stat">${score}%</div><h3>${correct} / ${examQuestions.length} correct</h3><div class="progress"><div style="width:${score}%"></div></div><p class="muted">This practice score is not an official CBE score or a prediction of your exam result.</p><div class="row"><button class="btn primary" id="new-exam">New mock exam</button><button class="btn" id="exam-review">Review answers</button><button class="btn" id="exam-home">Dashboard</button></div></div>
 <h2 style="margin-top:25px">Answer review</h2>${examQuestions.map((q,i)=>`<details><summary>${i+1}. ${esc(q.q)} — ${examAnswers[i]===q.correct?"Correct":"Incorrect"}</summary><p><strong>Your answer:</strong> ${examAnswers[i]===null?"Not answered":esc(q.options[examAnswers[i]])}</p><p><strong>Correct answer:</strong> ${esc(q.options[q.correct])}</p><p>${esc(q.why)}</p></details>`).join("")}`;
 $("#new-exam").onclick=()=>{window.examIndex=0;startExam();};
 $("#exam-review").onclick=()=>{$("details")?.setAttribute("open","");};
 $("#exam-home").onclick=()=>navigate("home");
}
function renderExamEntry() {
 $("#main").innerHTML=pageHead("ASSESSMENT","Mock exam","Practice with a mixed-topic assessment.")+`<div class="card"><h2>30 questions</h2><p>Questions are selected from all course units. The suggested time is 60 minutes, but the site does not enforce a countdown.</p><button class="btn primary" id="begin-exam">Begin exam</button></div>`;
 $("#begin-exam").onclick=()=>{window.examIndex=0;startExam();};
}
function renderFormulas() {
 const groups=[
 ["Linear equations and functions",[
 ["Slope","m = (y₂ − y₁)/(x₂ − x₁)"],["Slope-intercept form","y = mx + b"],["Point-slope form","y − y₁ = m(x − x₁)"]]],
 ["Quadratics",[
 ["Standard form","y = ax² + bx + c"],["Quadratic formula","x = (−b ± √(b² − 4ac))/(2a)"],["Discriminant","D = b² − 4ac"],["Vertex x-coordinate","x = −b/(2a)"],["Vertex form","y = a(x − h)² + k"],["Difference of squares","a² − b² = (a − b)(a + b)"]]],
 ["Exponents and radicals",[
 ["Product rule","xᵃ · xᵇ = xᵃ⁺ᵇ"],["Quotient rule","xᵃ/xᵇ = xᵃ⁻ᵇ"],["Power of a power","(xᵃ)ᵇ = xᵃᵇ"],["Rational exponent","x^(1/n) = ⁿ√x"]]],
 ["Exponential and logarithmic",[
 ["Exponential model","y = abˣ"],["Compound interest","A = P(1 + r/n)ⁿᵗ"],["Logarithm definition","log_b(x) = y ⇔ bʸ = x"],["Product rule","log_b(xy) = log_b(x) + log_b(y)"],["Quotient rule","log_b(x/y) = log_b(x) − log_b(y)"],["Power rule","log_b(xᵖ) = p log_b(x)"]]],
 ["Sequences and probability",[
 ["Arithmetic term","aₙ = a₁ + (n−1)d"],["Geometric term","aₙ = a₁rⁿ⁻¹"],["Arithmetic series","Sₙ = n(a₁ + aₙ)/2"],["Basic probability","P(A) = favorable outcomes / total outcomes"],["Complement","P(not A) = 1 − P(A)"]]]
 ];
 $("#main").innerHTML=pageHead("REFERENCE","Formula library","A quick reference for formulas used in the course. Make sure you understand when each formula applies, not just how to copy it.")+groups.map(g=>`<section class="card" style="margin-bottom:18px"><h2>${esc(g[0])}</h2><table><tbody>${g[1].map(r=>`<tr><td>${esc(r[0])}</td><td><strong>${esc(r[1])}</strong></td></tr>`).join("")}</tbody></table></section>`).join("")+
 `<div class="note"><strong>Study tip:</strong> For every formula, identify what each variable represents, check any restrictions, and practice choosing the right formula for a question.</div>`;
}
function renderNotes() {
 $("#main").innerHTML=pageHead("PERSONAL STUDY SPACE","My notes","Write down formulas, questions to revisit, and concepts you want to review. Your notes are saved in this browser.")+
 `<div class="card"><label for="notes-area"><strong>Study notes</strong></label><textarea id="notes-area" placeholder="Example: I need more practice with factoring quadratics...">${esc(state.notes)}</textarea><div class="row" style="margin-top:12px"><button class="btn primary" id="save-notes">Save notes</button><span class="muted small">Saved locally on this device.</span></div></div>`;
 $("#save-notes").onclick=()=>{state.notes=$("#notes-area").value;save();toast("Notes saved.");};
}
function renderProgress() {
 const scores=state.scores;
 const avg=scores.length?Math.round(scores.reduce((s,x)=>s+x.score,0)/scores.length):0;
 const recent=scores.slice(-8).reverse();
 const weak=Object.entries(state.weakTopics).sort((a,b)=>b[1]-a[1]);
 $("#main").innerHTML=pageHead("YOUR DATA","Progress and review","Track your completed lessons, practice results, study streak, and topics that may need more attention.")+
 `<div class="grid"><div class="card"><div class="stat">${pct()}%</div><div class="stat-label">Lessons complete</div></div><div class="card"><div class="stat">${avg}%</div><div class="stat-label">Average assessment score</div></div><div class="card"><div class="stat">${scores.length}</div><div class="stat-label">Saved practice sessions</div></div></div>
 <div class="two-col" style="margin-top:20px"><div class="card"><h2>Assessment history</h2>${recent.length?recent.map(s=>`<div class="row" style="padding:11px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(s.type)}</strong><div class="muted small">${esc(s.date)} · ${s.correct}/${s.total}</div></div><strong>${s.score}%</strong></div>`).join(""):`<p class="muted">No completed assessments yet. Start a practice session or mock exam to begin tracking scores.</p>`}</div>
 <div class="card"><h2>Topics to review</h2>${weak.length?weak.map(([id,n])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(units.find(u=>u.id===id)?.title||id)}</span><span class="pill orange">${n} missed</span></div>`).join(""):`<p class="muted">Missed-question tracking will appear here after you practice.</p>`}<p class="muted small">This is a rough review guide based on recorded wrong answers, not a formal measure of mastery.</p></div></div>
 <div class="card" style="margin-top:20px"><h2>Backup your progress</h2><p class="muted">Export your progress and notes to a JSON file. Import that file later to restore the data in this browser or another browser.</p><div class="row"><button class="btn primary" id="export-data">Export progress</button><label class="btn" for="import-file">Import progress</label><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div></div>
 <div class="card" style="margin-top:20px"><h2>Reset progress</h2><p class="muted">This removes completion data, notes, and saved scores from this browser. Export a backup first if you want to keep them.</p><button class="btn danger" id="reset-data">Reset all progress</button></div>`;
 $("#export-data").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="algebra2cbe-progress.json";a.click();URL.revokeObjectURL(url);
 };
 $("#import-file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const data=JSON.parse(await f.text());
   if(!data||typeof data!=="object"||!Array.isArray(data.completed)||!Array.isArray(data.scores))throw new Error("Invalid file");
   if(!confirm("Import this backup and replace your current progress?"))return;
   state={...freshState(),...data};save();toast("Progress imported.");renderProgress();
  }catch(err){toast("Could not import that file.");}
 };
 $("#reset-data").onclick=()=>{
  if(confirm("Delete all Algebra 2 Academy progress and notes in this browser? This cannot be undone unless you have a backup.")){
   state=freshState();save();navigate("home");toast("Progress reset.");
  }
 };
}

function startExamFromPage() {window.examIndex=0;startExam();}
const oldExamRender=renderExam;
function renderExamPage() {
 $("#main").innerHTML=pageHead("ASSESSMENT","Mock exam","Test your understanding across course units.")+
 `<div class="card"><h2>Before you begin</h2><ul><li>30 mixed-topic questions.</li><li>Suggested duration: 60 minutes.</li><li>Review explanations after submitting.</li><li>Your result is saved locally.</li></ul><button class="btn primary" id="begin-exam">Begin mock exam</button></div>`;
 $("#begin-exam").onclick=()=>{window.examIndex=0;startExam();};
}
const originalRender=render;
render = function() {
 updateHeader();
 if(page==="exam" && !examQuestions.length) {renderExamPage();return;}
 originalRender();
};
render();
</script>
</body>
</html>
